name: Ansible Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod iz repozitorijuma
        uses: actions/checkout@v4
          
      - name: Instaliraj Tailscale na runneru
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Ucitaj SSH kljuc
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Dodaj VM u known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts

      - name: Instaliraj Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible
          ansible-galaxy collection install community.general

      - name: Napravi inventory.ini
        run: |
          echo "[webserver]" > inventory.ini
          echo "${{ secrets.VM_IP }} ansible_user=student ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini

      - name: Pokreni Ansible playbook
        run: ansible-playbook -i inventory.ini site.yml
